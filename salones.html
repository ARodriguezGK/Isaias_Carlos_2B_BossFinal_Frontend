<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos Prestige</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
    <header class="bg-dark text-white py-3 shadow">
        <div class="container-fluid px-4 d-flex justify-content-between align-items-center">
            <h1 class="h4 mb-0">Sistema de gestion de eventos</h1>
            <span class="badge log-primary">2B</span>
        </div>
    </header>

    <div class="container-fluid flex-grow-1">
        <div class="row">
            <nav class="col-12 col-md-3 col-lg-2 bg-white border-end py-3">
                <div class="list-group">
                    <a href="index.html" class="list-group-item list-group-item action">Eventos</a>
                    <a href="clientes.html" class="list-group-item list-group-item action">Clientes</a>
                    <a href="salones.html" class="list-group-item list-group-item action active">Salones</a>
                </div>
            </nav>

            <main class="col-12 col-md-9 col-lg-10 p-4">

                <!-- alertContainer -->
                <div id="alertContainer">
                </div>

                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white">Listado de Salones</div>
                    <div class="card-body table-responsive">
                        <table class="table table-striped table-hover align-middle">
                            <thead class="table-dark">
                                <tr>
                                    <th>#</th>
                                    <th>Nombre</th>
                                    <th>Capacidad</th>
                                    <th>Precio renta</th>
                                    <th>Ubicacion</th>
                                </tr>
                            </thead>
                            <!-- tablaSalon -->
                            <tbody id="tablaSalon"></tbody>
                        </table>
                    </div>
                </div>

            </main>

        </div>
    </div>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <small>Alexander Isaias Hernandez Aviles 20250145</small>
        <small>Carlos Alejandro Lopez Rodriguez 20250156</small>
    </footer>
    <script src="js/controllers/salonesController.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
