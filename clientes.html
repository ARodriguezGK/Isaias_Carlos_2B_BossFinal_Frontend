<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos Prestige</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
    <header class="bg-dark text-white py-3 shadow">
        <div class="container-fluid px-4 d-flex justify-content-between align-items-center">
            <h1 class="h4 mb-0">Sistema de gestion de eventos</h1>
            <span class="badge log-primary">2B</span>
        </div>
    </header>

    <div class="container-fluid flex-grow-1">
        <div class="row">
            <nav class="col-12 col-md-3 col-lg-2 bg-white border-end py-3">
                <div class="list-group">
                    <a href="index.html" class="list-group-item list-group-item action">Eventos</a>
                    <a href="clientes.html" class="list-group-item list-group-item action active">Clientes</a>
                    <a href="salones.html" class="list-group-item list-group-item action">Salones</a>
                </div>
            </nav>

            <main class="col-12 col-md-9 col-lg-10 p-4">

                <!-- alertContainer -->
                <div id="alertContainer">
                </div>

                <div class="card shadow-sm mb-4">
                    <!-- tituloForm -->
                    <div id="tituloForm" class="card-header bg-primary text-white">
                    Registrar Clientes
                    </div>

                    <div class="card-body">
                        <!-- formCliente -->
                        <form id="formCliente" novalidate>

                            <div class="col-md-6">
                                <!-- idCliente -->
                                <input id="idCliente" type="hidden">
                            </div>

                            <div class="row g-3">

                                <div class="col-md-6">
                                    <!-- txtnombreCliente -->
                                    <label for="txtnombreCliente" class="form-label">Nombre</label>
                                    <input id="txtnombreCliente" class="form-control" type="text">
                                </div>

                                <div class="col-md-6">
                                    <!-- txtapellidoCliente -->
                                    <label for="txtapellidoCliente" class="form-label">Apellido</label>
                                    <input type="text" class="form-control" id="txtapellidoCliente">
                                </div>

                                <div class="col-md-6">
                                    <!-- numCliente -->
                                     <label for="numCliente" class="form-label">Telefono</label>
                                     <input type="number" class="form-control" id="numCliente">
                                </div>

                                <div class="col-md-6">
                                    <!-- txtEmailCliente -->
                                     <label for="txtEmailCliente" class="form-label">EMAIL</label>
                                     <input type="email" class="form-control" id="txtEmailCliente">
                                </div>

                                <div class="col-md-6">
                                    <!-- txtdireccionCliente -->
                                     <label for="txtdireccionCliente" class="form-label">Direccion</label>
                                     <input type="text" class="form-control" id="txtdireccionCliente">
                                </div>

                            </div>

                            <div class="mt-4">
                                <button type="submit" id="btnGuardar" class="btn btn-success">Guardar</button>
                                <button type="button" id="btnCancelar" class="btn btn-secondary">Cancelar</button>
                            </div>

                        </form>
                    </div>

                </div>

                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white">Listado de clientes</div>
                    <div class="card-body table-responsive">
                        <table class="table table-striped table-hover align-middle">
                            <thead class="table-dark">
                                <tr>
                                    <th>#</th>
                                    <th>Nombre</th>
                                    <th>Apellido</th>
                                    <th>Telefono</th>
                                    <th>EMAIL</th>
                                    <th>Direccion</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <!-- tablaClientes -->
                            <tbody id="tablaClientes"></tbody>
                        </table>
                    </div>
                </div>

            </main>

        </div>
    </div>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <small>Alexander Isaias Hernandez Aviles 20250145</small>
        <small>Carlos Alejandro Lopez Rodriguez 20250156</small>
    </footer>

    <script src="js/controllers/clientesController.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
